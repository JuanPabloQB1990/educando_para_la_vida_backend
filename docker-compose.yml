version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: productos_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: productos
      MYSQL_USER: developer
      MYSQL_PASSWORD: dev123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/products.sql:/docker-entrypoint-initdb.d/products.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: institucion_api
    environment:
      DB_HOST: db
      DB_USER: developer
      DB_PASSWORD: dev123
      DB_NAME: productos
      DB_PORT: 3306
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  mysql_data:
